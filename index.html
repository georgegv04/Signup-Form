<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main class="signup-page">
      <section class="hero">
        <img
          src="images/sky.jpg"
          class="hero-image"
          alt="Sky with light rays"
        />
        <div class="hero-logo-card">
          <div class="card-container">
            <img src="images/cross.svg" class="cross" alt="Christian cross" />
            <p class="big-text">THE WAY</p>
          </div>
          <p class="subtitle">JESUS IS THE WAY, THE TRUTH, AND THE LIFE</p>
        </div>
      </section>
      <section class="signup-content">
        <div class="content-wrapper">
          <p class="intro-main">
            No matter where you are in life, you are not alone. Jesus offers
            grace, purpose, and a new beginning.
          </p>
          <p class="intro-text">
            Sign up to discover more about God and His truth.
          </p>

          <h1 class="signup-heading">Create your account</h1>
        </div>
      </section>
    </main>
  </body>
</html>

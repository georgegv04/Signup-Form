<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="signup-page">
      <section class="hero">
        <img
          src="images/sky.jpg"
          class="hero-image"
          alt="Sky with light rays"
        />
        <div class="hero-logo-card">
          <div class="card-container">
            <img src="images/cross.svg" class="cross" alt="Christian cross" />
            <p class="big-text">THE WAY</p>
          </div>
          <p class="subtitle">JESUS IS THE WAY, THE TRUTH, AND THE LIFE</p>
        </div>
      </section>
      <section class="signup-content">
        <div class="content-wrapper">
          <p class="intro-main">
            No matter where you are in life, you are not alone. Jesus offers
            grace, purpose, and a new beginning.
          </p>
          <p class="intro-text">
            Sign up to discover more about God and His truth.
          </p>

          <div class="right-section">
            <h1 class="signup-heading">Create your account</h1>
            <form method="post">
              <fieldset class="form-card">
                <legend>Account Details</legend>

                <div class="form-grid">
                  <div class="form-row">
                    <label for="first-name">First name</label>
                    <input
                      type="text"
                      id="first-name"
                      name="first-name"
                      placeholder="John"
                      required
                    />
                  </div>
                  <div class="form-row">
                    <label for="last-name">Last name</label>
                    <input
                      type="text"
                      id="last-name"
                      name="last-name"
                      placeholder="Smith"
                      required
                    />
                  </div>
                  <div class="form-row">
                    <label for="email">Email</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder="emailname@email.com"
                      required
                    />
                  </div>
                  <div class="form-row">
                    <label for="number">Phone number</label>
                    <input
                      type="tel"
                      id="number"
                      name="phone-number"
                      placeholder="+357 xx xxxxxx"
                      required
                    />
                  </div>
                  <div class="form-row">
                    <label for="password">Password</label>
                    <input
                      class="validate-pw"
                      type="password"
                      id="password"
                      name="password"
                      placeholder="At least 8 characters"
                      required
                      minlength="8"
                      maxlength="15"
                    />
                  </div>
                  <div class="form-row">
                    <label for="confirm-pw">Confirm password</label>
                    <input
                      class="validate-pw"
                      type="password"
                      id="confirm-pw"
                      name="confirm-password"
                      placeholder="Repeat your password"
                      required
                      minlength="8"
                      maxlength="15"
                    />
                  </div>
                </div>
              </fieldset>

          </div>
          <div class="checkbox-button">
            <input type="checkbox" id="agree" name="i-agree" />
            <label for="agree" class="terms"
              >I agree to the <a href="#">Terms</a> and
              <a href="#">Privacy Policy</a>.</label
            >
          </div>
          <button type="submit">Create account</button>
          <p>Already have an account? <a href="#">Log in</a></p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
